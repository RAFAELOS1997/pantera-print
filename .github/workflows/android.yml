name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PanteraPrint.apk

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanteraPrint
          path: PanteraPrint.apk
          if-no-files-found: error

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.1 --yes --cleanup-tag || true
          gh release create v0.1.1 PanteraPrint.apk --title "Pantera Print v0.1.1" --notes "Primeira versão de diagnóstico Bluetooth/BLE da Pantera Print."
